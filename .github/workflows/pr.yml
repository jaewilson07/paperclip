name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Fork: run the fork's own pr-trusted.yml so CI matches the fork's code.
    # Upstream's pr-trusted.yml@master is newer than this fork and calls scripts it lacks.
    uses: ./.github/workflows/pr-trusted.yml
